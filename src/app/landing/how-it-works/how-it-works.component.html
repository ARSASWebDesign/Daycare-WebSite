<section id="how-it-works" class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <span class="text-sm font-semibold text-primary uppercase tracking-wider">Cómo funciona</span>
      <h2 class="text-3xl sm:text-4xl font-bold text-gray-900 mt-3 mb-4">
        Empezar es más fácil de lo que pensás
      </h2>
      <p class="text-lg text-gray-600">
        En menos de una semana tu institución puede estar funcionando con DayCare Manager.
      </p>
    </div>

    <div class="grid md:grid-cols-4 gap-8 relative">
      <!-- Connector line (desktop) -->
      <div class="hidden md:block absolute top-12 left-[12%] right-[12%] h-0.5 bg-blue-100" aria-hidden="true"></div>

      @for (step of steps; track step.number) {
        <div class="text-center relative">
          <div class="w-24 h-24 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-5 relative z-10">
            <span class="text-3xl font-bold text-primary">{{ step.number }}</span>
          </div>
          <h3 class="text-lg font-bold text-gray-900 mb-2">{{ step.title }}</h3>
          <p class="text-sm text-gray-600 max-w-xs mx-auto">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
