<section class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <span class="text-sm font-semibold text-primary uppercase tracking-wider">Testimonios</span>
      <h2 class="text-3xl sm:text-4xl font-bold text-gray-900 mt-3 mb-4">
        Lo que dicen nuestros clientes
      </h2>
    </div>

    <div class="grid md:grid-cols-3 gap-8">
      @for (testimonial of testimonials; track testimonial.name) {
        <div class="bg-gray-50 rounded-xl p-8 border border-gray-100">
          <div class="flex text-yellow-400 mb-4" aria-label="5 estrellas">{{ testimonial.stars }}</div>
          <p class="text-gray-700 mb-6 leading-relaxed">{{ testimonial.text }}</p>
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 {{ testimonial.avatarBg }} rounded-full flex items-center justify-center {{ testimonial.avatarColor }} font-bold text-sm">
              {{ testimonial.initials }}
            </div>
            <div>
              <p class="text-sm font-semibold text-gray-900">{{ testimonial.name }}</p>
              <p class="text-xs text-gray-500">{{ testimonial.role }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
