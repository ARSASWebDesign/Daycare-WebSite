<nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2" aria-label="DayCare Manager - Inicio">
        <span class="text-2xl" aria-hidden="true">🌱</span>
        <span class="text-xl font-bold text-gray-900">DayCare <span class="text-primary">Manager</span></span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden md:flex items-center gap-8">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            class="text-sm font-medium text-gray-600 hover:text-primary transition"
          >
            {{ link.label }}
          </a>
        }
        <a
          href="#contact"
          class="inline-flex items-center px-5 py-2.5 text-sm font-semibold text-white bg-primary rounded-lg hover:bg-primary-hover transition shadow-sm"
        >
          Solicitar Demo
        </a>
      </div>

      <!-- Mobile menu button -->
      <button
        type="button"
        class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Menú de navegación"
      >
        @if (mobileMenuOpen()) {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Nav -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden bg-white border-t border-gray-100 px-4 py-4 space-y-3 animate-slide-down">
      @for (link of navLinks; track link.href) {
        <a
          [href]="link.href"
          class="block text-sm font-medium text-gray-600 hover:text-primary py-2"
          (click)="closeMobileMenu()"
        >
          {{ link.label }}
        </a>
      }
      <a
        href="#contact"
        class="block text-center px-5 py-2.5 text-sm font-semibold text-white bg-primary rounded-lg hover:bg-primary-hover transition"
        (click)="closeMobileMenu()"
      >
        Solicitar Demo
      </a>
    </div>
  }
</nav>
